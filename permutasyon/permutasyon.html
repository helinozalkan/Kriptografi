<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permütasyon Resim Şifreleme</title>
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        canvas {
            max-width: 100%;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-top: 10px;
            min-height: 200px;
            background: #f9f9f9;
        }
        body.dark canvas {
            border-color: #555;
            background: #2c2c2c;
        }
        .canvas-grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .canvas-container {
            width: 100%;
            text-align: center;
        }

        .styled-text-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
            background: #fff;
            transition: all 0.3s;
        }
        body.dark .styled-text-input {
            background-color: #2c2c2c;
            color: #f0f0f0;
            border-color: #555;
        }
        .styled-text-input:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.2);
        }
        body.dark .styled-text-input:focus {
            border-color: #00aaff;
            box-shadow: 0 0 5px rgba(0, 170, 255, 0.3);
        }

        .file-upload-input {
            width: 0.1px;
            height: 0.1px;
            opacity: 0;
            overflow: hidden;
            position: absolute;
            z-index: -1;
        }
    
        .file-upload-label {
            display: inline-block;
            padding: 12px 20px;
            background-color: #007bff;
            color: white !important;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.3s;
            font-size: 1em;
        }
        .file-upload-label:hover {
            background-color: #0056b3;
        }
        body.dark .file-upload-label {
            background-color: #00aaff;
            color: #121212 !important;
        }
        body.dark .file-upload-label:hover {
            background-color: #007bff;
        }
 
        .file-name-display {
            display: inline-block;
            margin-left: 15px;
            font-style: italic;
            color: #555;
        }
        body.dark .file-name-display {
            color: #bbb;
        }

  
        .mode-toggle-label {
            position: absolute;
            top: 30px;
            right: 5%;
            display: inline-block;
            width: 50px;
            height: 25px;
        }
        .mode-toggle-label input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 25px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 19px;
            width: 19px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #007bff; }
        input:checked + .slider:before { transform: translateX(25px); }
        

        .download-btn { 
            display: none;
            background-color: #007bff; 
            color: white !important; 
            text-decoration: none; 
            padding: 10px; 
            text-align: center; 
            border-radius: 6px; 
            margin-top: 10px; 
            width: 100%; 
            max-width: 250px; 
            box-sizing: border-box; 
            margin-left: auto;
            margin-right: auto;
        }
        .download-btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <header>
        <h1>Permütasyon Şifreleme (Resim)</h1>
        <label class="mode-toggle-label">
            <input type="checkbox" id="modeToggleCheckbox">
            <span class="slider"></span>
        </label>
    </header>

    <nav class="tabs">
        <button data-tab="encrypt" class="active">Şifreleme</button>
        <button data-tab="decrypt">De-Şifreleme</button>
    </nav>

    <main>
        <section id="encrypt" class="content-section tab active">
            <h2>Resim Şifreleme</h2>
            
            <div class="input-group">
                <label>Düz Resim Dosyası:</label>
                <div>
                    <label for="encryptImageInput" class="file-upload-label">Dosya Seç</label>
                    <input type="file" id="encryptImageInput" accept="image/*" class="file-upload-input">
                    <span id="encryptFileName" class="file-name-display">Dosya seçilmedi</span>
                </div>
            </div>

            <div class="input-group">
                <label for="encryptKey">Permütasyon Anahtarı:</label>
                <input type="text" id="encryptKey" class="styled-text-input" placeholder="Örn: 312 (1-9 arası, tekrarsız, sıralı)">
            </div>
            <button id="btnEncrypt">Şifrele</button>
            <div class="canvas-grid-container">
                <div class="canvas-container">
                    <h4>Giriş Resmi:</h4>
                    <canvas id="encryptCanvasInput"></canvas>
                </div>
                <div class="canvas-container">
                    <h4>Şifrelenmiş Resim:</h4>
                    <canvas id="encryptCanvasOutput"></canvas>
                    <a id="btnDownloadEncrypt" class="download-btn">Şifreli Resmi İndir</a>
                </div>
            </div>
        </section>

        <section id="decrypt" class="content-section tab">
            <h2>Resim De-Şifreleme</h2>
            
            <div class="input-group">
                <label>Şifreli Resim Dosyası:</label>
                <div>
                    <label for="decryptImageInput" class="file-upload-label">Dosya Seç</label>
                    <input type="file" id="decryptImageInput" accept="image/*" class="file-upload-input">
                    <span id="decryptFileName" class="file-name-display">Dosya seçilmedi</span>
                </div>
            </div>

            <div class="input-group">
                <label for="decryptKey">Permütasyon Anahtarı:</label>
                <input type="text" id="decryptKey" class="styled-text-input" placeholder="Şifrelemede kullanılan anahtarın aynısı">
            </div>
            <button id="btnDecrypt">De-Şifrele</button>
            <div class="canvas-grid-container">
                <div class="canvas-container">
                    <h4>Giriş Resmi (Şifreli):</h4>
                    <canvas id="decryptCanvasInput"></canvas>
                </div>
                <div class="canvas-container">
                    <h4>Çözülmüş Resim:</h4>
                    <canvas id="decryptCanvasOutput"></canvas>
                </div>
            </div>
        </section>
    </main>

    <script src="permutasyon.js"></script>
</body>
</html>
