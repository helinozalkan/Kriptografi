<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doğrusal Şifreleme Uygulaması</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header>
        <h1>Doğrusal Şifreleme Algoritması</h1>
        <button id="modeToggle" class="mode-toggle">🌙 Dark Mode</button>
    </header>

    <nav class="tabs">
        <button data-tab="encrypt" class="active">Şifreleme</button>
        <button data-tab="decrypt">De-Şifreleme</button>
        <button data-tab="crack">Şifre Kırma</button>
    </nav>

    <main>
        <!-- ŞİFRELEME BÖLÜMÜ -->
        <section id="encrypt" class="content-section tab active">
            <h2>Şifreleme</h2>
            <div class="input-group">
                <label for="alphabetEncrypt">Alfabe:</label>
                <select id="alphabetEncrypt" class="alphabet-select">
                    <option value="en">İngilizce (EN)</option>
                    <option value="tr">Türkçe (TR)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="plainInput">Düz Metin:</label>
                <textarea id="plainInput" rows="4" placeholder="Şifrelenecek metni buraya girin..."></textarea>
            </div>
            <div class="input-group">
                <label for="keyA_encrypt">"a" Anahtarı:</label>
                <input type="number" id="keyA_encrypt" value="5">
                <p class="error-message" id="keyA_encrypt_error"></p>
            </div>
            <div class="input-group">
                <label for="keyB_encrypt">"b" Anahtarı:</label>
                <input type="number" id="keyB_encrypt" value="8">
            </div>
            <button id="btnEncrypt">Şifrele</button>
            <div class="output-group">
                <label for="cipherOutput">Şifreli Metin:</label>
                <textarea id="cipherOutput" rows="4" readonly placeholder="Şifreli metin burada görünecektir."></textarea>
            </div>
        </section>

        <!-- DE-ŞİFRELEME BÖLÜMÜ -->
        <section id="decrypt" class="content-section tab">
            <h2>De-Şifreleme</h2>
            <div class="input-group">
                <label for="alphabetDecrypt">Alfabe:</label>
                <select id="alphabetDecrypt" class="alphabet-select">
                    <option value="en">İngilizce (EN)</option>
                    <option value="tr">Türkçe (TR)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="cipherInput">Şifreli Metin:</label>
                <textarea id="cipherInput" rows="4" placeholder="De-şifrelenecek metni buraya girin..."></textarea>
            </div>
             <div class="input-group">
                <label for="keyA_decrypt">"a" Anahtarı:</label>
                <input type="number" id="keyA_decrypt" value="5">
                <p class="error-message" id="keyA_decrypt_error"></p>
            </div>
            <div class="input-group">
                <label for="keyB_decrypt">"b" Anahtarı:</label>
                <input type="number" id="keyB_decrypt" value="8">
            </div>
            <button id="btnDecrypt">De-Şifrele</button>
            <div class="output-group">
                <label for="plainOutput">Düz Metin:</label>
                <textarea id="plainOutput" rows="4" readonly placeholder="Düz metin burada görünecektir."></textarea>
            </div>
        </section>

        <!-- ŞİFRE KIRMA BÖLÜMÜ -->
        <section id="crack" class="content-section tab">
            <h2>Şifre Kırma</h2>
            <div class="input-group">
                <label for="alphabetCrack">Analiz Edilecek Alfabe:</label>
                <select id="alphabetCrack" class="alphabet-select">
                    <option value="en">İngilizce (EN)</option>
                    <option value="tr">Türkçe (TR)</option>
                </select>
            </div>
            <div class="input-group">
                <label for="crackInput">Şifreli Metin:</label>
                <textarea id="crackInput" rows="4" placeholder="Kırılacak şifreli metni buraya girin..."></textarea>
            </div>
            <button id="btnCrack">Şifreyi Kır</button>
            <div class="output-group">
                <div id="crackCandidates" class="candidates-container">Olası (a, b) çiftleri ve çözümler burada listelenecek.</div>
            </div>
        </section>
    </main>

    <script src="dogrusal.js"></script>
</body>
</html>
